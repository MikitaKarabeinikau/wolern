name: Run Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: woler_test_user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}   # or a CI dummy value if tests mock authentication
          JWK_KEY: ${{ secrets.JWK_KEY }}
          PYTHONPATH: backend
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install pytest pytest-cov
        pip install pydantic[email]

    - name: Wait for PostgreSQL
      run: |
        until pg_isready -h localhost -p 5432 -U woler_test_user; do
          echo "Waiting for PostgreSQL..."
          sleep 2
        done

    - name: Set environment variables
      run: |
        echo "DATABASE_URL=postgresql+psycopg2://woler_test_user:password@localhost:5432/test_db" >> $GITHUB_ENV
        echo "PYTHONPATH=$GITHUB_WORKSPACE/backend/src" >> $GITHUB_ENV

    - name: Run unit tests
      run: |
        pytest backend/tests/unit/ -v --tb=short --cov=backend/src/database --cov-report=term-missing

    - name: Run API tests (if any)
      run: |
        pytest backend/tests/api/ -v --tb=short || echo "No API tests found"

    - name: Generate coverage report
      if: always()
      run: |
        pytest backend/tests/ --cov=backend/src --cov-report=xml --cov-report=html

    - name: Upload coverage to Codecov (optional)
      if: always()
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
